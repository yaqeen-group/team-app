<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071424">
<title>Yaqeen Group</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#0B3B5A; --teal:#0F7C7A; --amber:#E9A23B; --sand:#F6F1E7; --ink:#14222E;
  --mut:#6b7a86; --line:#E3E9ED; --bg:#fff; --field:#FAFCFD; --red:#DC2626; --ok:#15803D;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter','Noto Sans Bengali',system-ui,sans-serif;color:var(--ink);background:var(--sand);
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.2px;color:var(--navy)}
.logo .mk{width:38px;height:38px;border-radius:11px;background:var(--amber);color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.logo b{font-weight:800}.logo small{display:block;font-size:9px;letter-spacing:2.5px;font-weight:700;opacity:.6}
.logo.light{color:#fff}
.splash{flex:1;background:linear-gradient(160deg,var(--navy),var(--teal));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;min-height:100vh}
.splash .logo{transform:scale(1.5)}
.splash p{margin-top:28px;opacity:.75;font-size:13px}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;margin-top:24px}
.spin.dark{border-color:#dfe6ea;border-top-color:var(--teal)}
@keyframes sp{to{transform:rotate(360deg)}}
.pad{padding:22px 22px 32px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.top h1{font-size:17px;color:var(--navy);flex:1}
.top .back{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px}
h2{font-size:24px;color:var(--navy);margin:28px 0 4px;letter-spacing:-.3px}
h3{font-size:18px;color:var(--navy);margin:14px 0 6px}
.mut{color:var(--mut);font-size:13.5px;line-height:1.6}
label{display:block;font-size:12.5px;font-weight:600;color:#45545f;margin:14px 0 6px}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px;background:var(--field);outline:none;transition:border .15s}
.in:focus{border-color:var(--teal);background:#fff}
.pw{position:relative}.pw .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--teal);font-weight:600;padding:6px}
.btn{width:100%;background:var(--teal);color:#fff;border-radius:12px;padding:13px;font-weight:700;font-size:15px;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.6}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.red{background:#fff;color:var(--red);border:1.5px solid #F3CACA}
.btn.sm{padding:9px;font-size:13px;margin-top:0}
.link{color:var(--teal);font-weight:600;font-size:13.5px}
.right{text-align:right;margin-top:10px}.center{text-align:center}
.msg{margin-top:14px;border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.55}
.msg.err{background:#FDECEC;color:#991B1B}.msg.ok{background:#E7F5EE;color:#166534}.msg.info{background:#FFF6E5;color:#92400E}
.cen{display:flex;flex-direction:column;align-items:center;text-align:center}
.bigic{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:30px;font-size:40px}
.steps{width:100%;margin-top:22px;text-align:left}
.st{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.dot.ok{background:var(--teal)}.dot.wait{border:3px solid var(--amber)}
.hero{background:linear-gradient(150deg,var(--navy),var(--teal));color:#fff;padding:20px 20px 22px;border-radius:0 0 24px 24px}
.hero .hi{margin-top:18px;font-size:14px;opacity:.95}.hero .hi b{display:block;font-size:24px;margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:15px}.rt span{font-size:12.5px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:#EEF4F4;color:var(--teal)}
.tag.pending{background:#FFF3DC;color:#92400E}.tag.suspended,.tag.rejected{background:#FDECEC;color:#991B1B}
.two{display:flex;gap:8px;margin-top:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-align:left}
.tile b{display:block;color:var(--navy);font-size:15px;margin-top:6px}.tile small{color:var(--mut);font-size:12px}
.tile .ic{font-size:22px}.tile.soon{opacity:.55}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:6px}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:14px}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #F0F3F5;font-size:14px}.kv span{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;z-index:50;max-width:90%;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.chips{display:flex;gap:8px;padding:12px 16px 0}.chip{padding:7px 13px;border-radius:16px;background:#EEF2F4;color:#53626e;font-size:13px;font-weight:600}.chip.on{background:var(--navy);color:#fff}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7a8a96 50%),linear-gradient(135deg,#7a8a96 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}

/* ===== app shell ===== */
.crmwrap{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:#F4F6FB}
.crmwrap iframe{border:0;width:100%;height:100%;display:block}
.crmload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.shell{display:flex;flex-direction:column;min-height:100vh}
.view{flex:1;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.nf-bar{display:flex;justify-content:flex-end;margin:0 0 8px}
.nf-mark{border:0;background:#EEF4FF;color:#1d4ed8;font-weight:600;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
.nf-it{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 30px 12px 12px;margin-bottom:8px;position:relative;font:inherit;color:inherit;cursor:pointer}
.nf-it.new{background:#EEF6FF;border-color:#cfe0ff}
.nf-ic{flex:0 0 40px;height:40px;border-radius:50%;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font-size:20px}
.nf-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nf-tx b{font-size:14.5px;line-height:1.35}
.nf-tx span{font-size:13.5px;color:#475569;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nf-tx small{font-size:12px;color:#2563eb;margin-top:2px}
.nf-it:not(.new) .nf-tx small{color:#94a3b8}
.nf-dot{position:absolute;right:12px;top:18px;width:9px;height:9px;border-radius:50%;background:#2563eb}
.tb[data-t="notif"]{white-space:nowrap;font-size:10.5px}
.avl{position:relative;display:inline-flex;flex:0 0 auto;border-radius:50%;vertical-align:middle}
.avl>.av{box-shadow:0 0 0 2.5px #fff,0 0 0 5px var(--lc)}
.avb{position:absolute;right:-5px;bottom:-5px;line-height:1;font-style:normal;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.lv-silver{--lc:#A3ACB9}.lv-gold{--lc:#F5B301}.lv-platinum{--lc:#22C3D6}.lv-diamond{--lc:#3B82F6}.lv-heroic{--lc:#EF4444}
.lvln{display:block;margin-top:3px;font-size:12px;font-weight:600;color:#7C5A00}
.lvbar{height:5px;background:#EEF2F7;border-radius:9px;margin-top:5px;overflow:hidden}.lvbar i{display:block;height:100%;background:linear-gradient(90deg,#F5B301,#EF4444);border-radius:9px}
.na-card{text-align:center;padding:26px 18px}.na-card .bigic{margin:0 auto 10px}
.wdays{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.wd{display:flex;align-items:center;gap:5px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;margin:0;font-weight:500}
.wd input{margin:0;width:auto}
.today{padding:14px 14px 12px;margin-bottom:12px}
.tdh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.tdh b{font-size:15.5px}
.tdr{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 0;border-top:1px dashed var(--line);font:inherit;color:inherit;cursor:pointer}
.tdr span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tdr small{flex:0 0 auto;color:#64748b;font-size:12px}.tdr small.late{color:#dc2626;font-weight:600}
.tdf{display:flex;gap:8px;margin-top:10px}
.tdb{flex:1;border:1px solid var(--line);background:#F8FAFC;border-radius:12px;padding:9px 6px;font:inherit;font-size:13px;cursor:pointer}
.tdok{padding:10px 0 2px;color:#15803d;font-weight:600}
.rp-it{display:flex;gap:10px;align-items:flex-start}.rp-it .rt{flex:1;min-width:0}.rp-it.off{opacity:.55}
.rp-act{display:flex;gap:6px;margin-top:8px}.rp-act button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#98a5af;font-size:11px;font-weight:600;position:relative;padding:4px 0}
.tb .ti{font-size:20px;line-height:1;filter:grayscale(1);opacity:.7}.tb.on{color:var(--teal)}.tb.on .ti{filter:none;opacity:1}
.tb .bd{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;min-width:16px;text-align:center}
.top .act{display:flex;gap:4px}.top .act button{width:36px;height:36px;border-radius:10px;font-size:18px;display:flex;align-items:center;justify-content:center}
.top .sub{display:block;font-size:12px;color:var(--mut);font-weight:500}
.list .row{padding:12px 16px;border-bottom:1px solid #F2F5F7;width:100%;text-align:left}
.row em{font-style:normal;font-size:11.5px;color:#8794a0}.rr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cnt{background:var(--teal);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.fab{position:fixed;right:calc(50% - 224px);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:16px;background:var(--amber);color:var(--navy);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(233,162,59,.45);z-index:9}
@media (max-width:480px){.fab{right:16px}}
.sec{font-size:12.5px;font-weight:700;color:#53626e;margin:18px 0 6px}
.dotonline{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22C55E;margin-left:6px}
/* ===== chat ===== */
.chatwrap{display:flex;flex-direction:column;height:100vh;height:100dvh}
.msgs{flex:1;overflow-y:auto;background:#F3EFE6;padding:10px 10px 14px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:11px;background:#fff;padding:3px 10px;border-radius:9px;color:#6b7a86;margin:6px 0}
.bw{display:flex}.bw.me{justify-content:flex-end}
.bb{max-width:82%;background:#fff;border-radius:14px 14px 14px 4px;padding:7px 10px;font-size:14.5px;line-height:1.45;display:flex;flex-direction:column;gap:3px;word-wrap:break-word;overflow-wrap:anywhere;text-align:left}
.me .bb{background:#D7EFEC;border-radius:14px 14px 4px 14px}
.who{font-size:11.5px;color:#C2410C;font-weight:700}
.tk{align-self:flex-end;font-size:10.5px;color:#7a8a96;white-space:nowrap}.tk.read{color:var(--teal);font-weight:700}
.bb img.ph{max-width:220px;max-height:260px;border-radius:10px;display:block;background:#e6ecef;min-height:80px;min-width:120px;object-fit:cover}
.bb video{max-width:230px;border-radius:10px;background:#000}
.file{display:flex;gap:9px;align-items:center;background:#F6F8F9;border-radius:10px;padding:8px 10px;color:inherit;text-decoration:none}
.file b{font-size:13px;display:block}.file small{font-size:11px;color:#7a8a96}
.bb a{color:var(--teal);word-break:break-all}
.callcard{background:#0B3B5A;color:#fff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.callcard .btn{margin-top:0;background:var(--amber);color:var(--navy);padding:8px}
.pinbar{background:#FFF8EC;border-bottom:1px solid #F3DDB4;padding:8px 14px;font-size:13px;display:flex;gap:8px;align-items:center}
.pinbar span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.comp{display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
.comp textarea{flex:1;border:0;background:#F1F4F6;border-radius:18px;padding:10px 14px;font-size:15px;resize:none;max-height:120px;outline:none}
.comp .cb{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.comp .snd{background:var(--teal);color:#fff;font-size:18px}
.readonly{padding:14px;text-align:center;color:var(--mut);font-size:13px;background:#fff;border-top:1px solid var(--line)}
.older{align-self:center;font-size:12.5px;color:var(--teal);font-weight:600;padding:6px 12px;background:#fff;border-radius:12px}
.upl{align-self:flex-end;font-size:12px;color:var(--mut);background:#fff;padding:6px 10px;border-radius:10px}
/* ===== sheet ===== */
.sheetbg{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#d5dde2;margin:4px auto 10px}
.sheet h3{margin-top:4px}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid #F0F3F5;font-size:15px;text-align:left}
.sheet .opt:last-child{border-bottom:0}.sheet .opt.red{color:var(--red)}
.attgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.attgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#45545f;padding:10px 0}
.attgrid .ai{width:48px;height:48px;border-radius:14px;background:#E3F1F0;display:flex;align-items:center;justify-content:center;font-size:22px}
/* ===== notices / tasks ===== */
.card.amb{background:#FFF8EC;border-color:#F3DDB4}
.nh{font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.5px;display:flex;gap:6px;align-items:center}
.card h4{font-size:15.5px;color:var(--navy);margin:4px 0}
.card .body{font-size:14px;color:#3d4c57;line-height:1.6;white-space:pre-wrap}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#8794a0;margin-top:8px;flex-wrap:wrap}
.pri{font-size:11px;font-weight:800;letter-spacing:.4px}
.pri.urgent{color:#DC2626}.pri.high{color:#EA580C}.pri.medium{color:var(--teal)}.pri.low{color:#64748B}
.stt{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:#EEF2F4;color:#45545f}
.stt.completed{background:#E7F5EE;color:#166534}.stt.in_progress{background:#E0EEFF;color:#1D4ED8}.stt.under_review{background:#FFF3DC;color:#92400E}
.overdue{color:var(--red);font-weight:700}
.chips{overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap}
textarea.in{min-height:96px;resize:vertical;line-height:1.55}
.check{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:12px}
.check input{width:20px;height:20px;accent-color:var(--teal)}
.meter{height:10px;background:#EEF2F4;border-radius:6px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--teal)}
.meter i.warn{background:var(--amber)}.meter i.bad{background:var(--red)}
.member{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0F3F5}
.member .rt b{font-size:14px}
.smallbtn{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:9px;border:1.5px solid var(--line);color:var(--navy);background:#fff}
.smallbtn.red{color:var(--red);border-color:#F3CACA}.smallbtn.ok{background:var(--teal);color:#fff;border-color:var(--teal)}
.upd{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin-top:10px;font-size:13.5px}
.upd small{display:block;color:#8794a0;font-size:11.5px}
.hero .kp{display:flex;gap:8px;margin-top:14px}.hero .kp div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:9px 10px}
.hero .kp b{display:block;font-size:20px}.hero .kp span{font-size:11px;opacity:.85}

/* ===== home v2 ===== */
button.row{width:100%;text-align:left}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px}
.qi{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#3d4c57;padding:6px 0}
.qic{width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 2px 6px rgba(11,59,90,.08)}
.hero .kp .ki{display:block;font-size:15px;margin-bottom:2px}
.hsec{display:flex;align-items:center;gap:8px;margin:22px 0 8px}
.hsec b{flex:1;font-size:15px;color:var(--navy)}
.hsi{width:28px;height:28px;border-radius:9px;background:#EEF4F4;display:flex;align-items:center;justify-content:center;font-size:15px}
.see{font-size:12.5px;font-weight:600;color:var(--teal)}
.hcard{width:100%;text-align:left;display:flex;align-items:center;gap:12px;margin-top:8px}
.hci{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hempty{display:flex;align-items:center;gap:12px;background:#F8FAFB;border:1px dashed #DCE3E8;border-radius:14px;padding:14px;color:var(--mut);font-size:13.5px}

<script>
/* =========================================================
   YAQEEN GROUP TEAM APP — Step 3: Login, sign-up, approval
   ========================================================= */
const SUPABASE_URL = 'https://tflnmzklgnvzmtwwmfpj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_C9ZIJrtRUlA5Ye31L6hi5w_pMzzB4ik'; // publishable key — safe in the app
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true,
    // phones: the browser 'lock' can get stuck after the app sleeps, freezing the app — run without it
    lock: (name, acquireTimeout, fn) => fn() }
});
const APP_URL = location.origin + location.pathname;
const $app = document.getElementById('app');
const state = { session: null, profile: null, companies: [], departments: [], recovering: false };

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => (n || '?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
const logo = (light=false) => `<div class="logo ${light?'light':''}"><img class="mk" src="mark.jpg" alt="Yaqeen Group"><span><b>Yaqeen</b> Group<small>TEAM</small></span></div>`;
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),3200); }
function showMsg(id, text, type='err'){ const el=document.getElementById(id); if(el){ el.className='msg '+type; el.textContent=text; el.hidden=false; } }
function busy(btn, on, label){ if(!btn) return; btn.disabled=on; if(on){ btn.dataset.l=btn.innerHTML; btn.innerHTML='<span class="spin" style="width:18px;height:18px;margin:0;border-width:2px"></span>'; } else btn.innerHTML=label||btn.dataset.l; }
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

function friendlyError(err){
  const m = (err && (err.message || err.error_description || String(err))) || '';
  if (/Invalid login credentials/i.test(m)) return 'ইমেইল বা পাসওয়ার্ড ভুল হয়েছে।';
  if (/Email not confirmed/i.test(m)) return 'ইমেইল এখনো যাচাই হয়নি। ইমেইলে পাঠানো লিংকে ক্লিক করুন।';
  if (/already registered|already been registered/i.test(m)) return 'এই ইমেইলে আগেই অ্যাকাউন্ট আছে। লগইন করুন।';
  if (/rate limit|too many|security purposes/i.test(m)) return 'অল্প সময়ে অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।';
  if (/Password should be|weak/i.test(m)) return 'পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।';
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'ইন্টারনেট সংযোগ নেই। সংযোগ চেক করে আবার চেষ্টা করুন।';
  if (/same as the old|different from the old/i.test(m)) return 'নতুন পাসওয়ার্ড আগেরটা থেকে আলাদা হতে হবে।';
  return 'কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করুন।';
}
function pwToggle(){ document.querySelectorAll('.pw .eye').forEach(b=>b.onclick=()=>{ const i=b.previousElementSibling; i.type=i.type==='password'?'text':'password'; b.textContent=i.type==='password'?'Show':'Hide'; }); }

async function loadLookups(){
  if (state.companies.length) return;
  const [c, d] = await Promise.all([
    sb.from('companies').select('id,name').order('name'),
    sb.from('departments').select('id,name').order('name')
  ]);
  state.companies = c.data || []; state.departments = d.data || [];
}
async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
  if (error) throw error;
  state.profile = data;
}

/* ---------- router ---------- */
const withTO = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
async function route(){
  if (state.recovering) return renderNewPassword();
  let data;
  try { ({ data } = await withTO(sb.auth.getSession(), 12000)); }
  catch(e){ return renderError('সংযোগ ধীর বা সাময়িক সমস্যা হচ্ছে। আবার চেষ্টা করুন।'); }
  state.session = data.session;
  if (!state.session) return renderLogin();
  try { await withTO(loadProfile(), 15000); } catch(e){ return renderError(e && e.message === 'timeout' ? 'সংযোগ ধীর বা সাময়িক সমস্যা হচ্ছে। আবার চেষ্টা করুন।' : friendlyError(e)); }
  const p = state.profile;
  if (!p) return renderError('প্রোফাইল পাওয়া যায়নি। অ্যাডমিনের সাথে যোগাযোগ করুন।');
  if (p.status === 'pending')   return renderPending();
  if (p.status === 'rejected')  return renderBlocked('অ্যাকাউন্ট গ্রহণ করা হয়নি', 'আপনার রেজিস্ট্রেশন অনুরোধ অ্যাডমিন বাতিল করেছেন। ভুল হলে অ্যাডমিনের সাথে যোগাযোগ করুন।');
  if (p.status === 'suspended') return renderBlocked('অ্যাকাউন্ট বন্ধ আছে', 'আপনার অ্যাকাউন্ট সাময়িকভাবে বন্ধ করা হয়েছে। বিস্তারিত জানতে অ্যাডমিনের সাথে যোগাযোগ করুন।');
  renderHome();
}

function renderLogin(prefill=''){

/* ---------- admin: approvals ---------- */
async function renderApprovals(){
  $app.innerHTML = `<div class="top"><button class="back" id="bk">←</button><h1>Approval requests</h1></div><div class="pad cen"><div class="spin dark"></div></div>`;
  document.getElementById('bk').onclick = renderHome;
  await loadLookups();
  const { data, error } = await sb.from('profiles').select('*').eq('status','pending').order('created_at');
  const box = document.querySelector('.pad');
  if (error) { box.innerHTML = `<div class="msg err">${esc(friendlyError(error))}</div>`; return; }
  if (!data.length) { box.innerHTML = `<div class="empty">কোনো অপেক্ষমাণ অনুরোধ নেই ✓</div>`; return; }
  box.className = 'pad'; box.style.paddingTop = '4px';
  box.innerHTML = data.map(u => `<div class="card" data-id="${u.id}">
    <div class="row"><div class="av">${esc(initials(u.full_name))}</div><div class="rt"><b>${esc(u.full_name)}</b><span>${esc(u.email)}</span></div></div>
    <p class="mut" style="margin-top:8px;font-size:12.5px">${esc(nameOf(state.companies,u.company_id))} · ${esc(nameOf(state.departments,u.department_id))}${u.designation?' · '+esc(u.designation):''}</p>
    <div class="two"><button class="btn sm" data-a="active">Approve</button><button class="btn sm ghost" data-a="rejected">Reject</button></div>
  </div>`).join('');
  box.querySelectorAll('button[data-a]').forEach(b => b.onclick = async () => {
    const card = b.closest('.card'), id = card.dataset.id, status = b.dataset.a;
    if (status === 'rejected' && !confirm('এই অনুরোধ বাতিল করবেন?')) return;
    b.disabled = true;
    const { error } = await sb.from('profiles').update({ status }).eq('id', id);
    if (error) { b.disabled = false; return toast(friendlyError(error)); }
    card.remove(); toast(status === 'active' ? 'অনুমোদন দেওয়া হয়েছে ✓' : 'অনুরোধ বাতিল করা হয়েছে');
    if (!box.querySelector('.card')) box.innerHTML = `<div class="empty">কোনো অপেক্ষমাণ অনুরোধ নেই ✓</div>`;
  });
}

  const me = state.profile.id;
  box.innerHTML = data.map(u => `<div class="card" data-id="${u.id}">
    <div class="row"><div class="av">${esc(initials(u.full_name))}</div>
      <div class="rt"><b>${esc(u.full_name)}${u.id===me?' (আপনি)':''}</b><span>${esc(u.designation||'')} · ${esc(nameOf(state.companies,u.company_id))}</span></div>

async function loadMessages(room, older) {
  let q = sb.from('messages').select('*').eq('conversation_id', room.conv.id).order('created_at', { ascending: false }).limit(40);
  if (older && room.oldest) q = q.lt('created_at', room.oldest);
  const { data, error } = await q;
  if (error) { document.getElementById('ms').innerHTML = `<div class="msg err">${esc(friendlyError(error))}</div>`; return; }
  const batch = (data || []).reverse();
  room.hasMore = (data || []).length === 40;
  if (batch.length) room.oldest = batch[0].created_at;
  room.msgs = older ? batch.concat(room.msgs) : batch;
  await signUrls(room, batch);
  drawMessages(room, !older);
}
async function signUrls(room, list) {
  const paths = list.filter(m => m.attachment_path && !room.urls[m.attachment_path]).map(m => m.attachment_path);
  if (!paths.length) return;
  const { data } = await sb.storage.from('chat-files').createSignedUrls(paths, 3600 * 6);
  (data || []).forEach(d => { if (d.signedUrl) room.urls[d.path] = d.signedUrl; });
}
function readBy(room, m) {

}

const EVERYONE = 'everyone';
function roomPeople(room) {
  return room.members.map(x => ui.people[x.user_id]).filter(Boolean).sort((a, b) => a.full_name.localeCompare(b.full_name));
}
function mentionSuggest(room, tx) {
  const box = document.getElementById('mbox'); if (!box) return;
  const before = tx.value.slice(0, tx.selectionStart);
  const m = before.match(/(^|\s)@([^\s@]*)$/);
  if (!m) { box.hidden = true; return; }
  const q = m[2].toLowerCase();
  const list = roomPeople(room).filter(p => p.id !== state.profile.id && (!q || p.full_name.toLowerCase().split(/\s+/).some(w => w.startsWith(q)) || p.full_name.toLowerCase().startsWith(q)));
  const showAll = !q || EVERYONE.startsWith(q) || 'সবাই'.startsWith(q);
  if (!list.length && !showAll) { box.hidden = true; return; }
  box.innerHTML = (showAll ? `<button class="mopt" data-n="${EVERYONE}"><span class="av" style="width:34px;height:34px;background:var(--amber);color:var(--navy);font-size:16px">👥</span><div class="rt"><b>@everyone</b><span>গ্রুপের সবাইকে ট্যাগ করুন</span></div></button>` : '') +
    list.slice(0, 8).map(p => `<button class="mopt" data-n="${esc(p.full_name)}">${avatar(p.full_name, p.id, 34)}<div class="rt"><b>${esc(p.full_name)}</b><span>${esc(p.designation || '')}</span></div></button>`).join('');
  box.hidden = false;
  box.querySelectorAll('.mopt').forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => {
    const pos = tx.selectionStart, start = before.length - m[2].length - 1;
    const ins = '@' + b.dataset.n + ' ';
    tx.value = tx.value.slice(0, start) + ins + tx.value.slice(pos);
    const p = start + ins.length; tx.focus(); tx.setSelectionRange(p, p); box.hidden = true;
    tx.style.height = 'auto'; tx.style.height = Math.min(tx.scrollHeight, 120) + 'px';
  }; });
}
function findMentions(room, body) {
  const ids = new Set();
  const others = roomPeople(room).filter(p => p.id !== state.profile.id);
  if (new RegExp('(^|\\s)@' + EVERYONE + '(?![\\w])', 'i').test(body)) others.forEach(p => ids.add(p.id));
  others.forEach(p => { if (body.toLowerCase().includes('@' + p.full_name.toLowerCase())) ids.add(p.id); });
  return [...ids];
}
function renderBody(text, room) {
  let html = linkify(text);
  if (!room || room.conv.type !== 'group' || text.indexOf('@') === -1) return html;
  const names = roomPeople(room).map(p => ({ n: esc('@' + p.full_name), me: p.id === state.profile.id })).sort((a, b) => b.n.length - a.n.length);
  names.push({ n: '@' + EVERYONE, me: true });
  const marks = [];
  for (const { n, me } of names) {
    let i = 0, low = html.toLowerCase();
    while ((i = low.indexOf(n.toLowerCase(), i)) !== -1) {
      if (!marks.some(x => i < x.e && i + n.length > x.s)) marks.push({ s: i, e: i + n.length, me });
      i += n.length;
    }
  }
  marks.sort((a, b) => b.s - a.s).forEach(x => { html = html.slice(0, x.s) + `<span class="mention ${x.me ? 'me' : ''}">${html.slice(x.s, x.e)}</span>` + html.slice(x.e); });
  return html;
}

async function compressImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return file; }
}
async function uploadFile(room, file, kind) {
  if (kind === 'image') file = await compressImage(file);
  if (file.size > MAX_FILE) return toast('ফাইলটা ২৫ MB-এর বেশি। Google Drive-এ রেখে লিংক পাঠান।');

  const note = document.createElement('div'); note.className = 'upl'; note.textContent = '⏫ Uploading ' + file.name + '…'; ms.appendChild(note); ms.scrollTop = ms.scrollHeight;
  const safe = file.name.replace(/[^\w.\-]+/g, '_').slice(-80);
  const path = `${room.conv.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safe}`;
  const { error: upErr } = await sb.storage.from('chat-files').upload(path, file, { contentType: file.type, upsert: false });
  if (upErr) { note.remove(); return toast(/mime|type/i.test(upErr.message) ? 'এই ধরনের ফাইল পাঠানো যায় না।' : /size|large/i.test(upErr.message) ? 'ফাইলটা খুব বড়।' : friendlyError(upErr)); }
  const { error } = await sb.from('messages').insert({
    conversation_id: room.conv.id, sender_id: state.profile.id, attachment_path: path,
    attachment_name: file.name.slice(0, 200), attachment_type: kind, attachment_size: file.size

  note.remove();
  if (error) { await sb.storage.from('chat-files').remove([path]); toast(friendlyError(error)); }
}

// App ID & secure token come from the Supabase Edge Function 'agora-token' (App Certificate stays on the server)
const AGORA_SDK = 'https://cdn.jsdelivr.net/npm/agora-rtc-sdk-ng@4.24.5/AgoraRTC_N-production.js';
const call = { client: null, mic: null, cam: null, timer: null, start: 0, kind: 'audio', remotes: {} };
const uidFor = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return (h % 2000000000) + 1; };
const nameForUid = uid => { const p = Object.values(ui.people).find(x => uidFor(x.id) === uid); return p ? p.full_name : 'Member'; };
const idForUid = uid => { const p = Object.values(ui.people).find(x => uidFor(x.id) === uid); return p ? p.id : String(uid); };
function loadAgora() {
  if (window.AgoraRTC) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = AGORA_SDK; sc.onload = res; sc.onerror = () => rej(new Error('Failed to fetch')); document.head.appendChild(sc); });
}
async function startCall(conv, kind) {
  if (call.client) return toast('আপনি ইতিমধ্যে একটা কলে আছেন');

  if (error) return toast(friendlyError(error));

}
async function getCallToken(channel) {
  const { data, error } = await sb.functions.invoke('agora-token', { body: { channel } });
  if (error) {
    let msg = '';
    try { const b = await error.context.json(); msg = b && b.error; } catch (e) {}
    const err = new Error(msg ? 'TOKEN:' + msg : 'TOKEN:' + (error.message || 'failed'));
    throw err;
  }
  if (!data || !data.token) throw new Error('TOKEN:empty');
  return data;
}
async function joinCall(channel, kind, title) {
  if (call.client) return toast('আপনি ইতিমধ্যে একটা কলে আছেন');
  closeIncoming();
  call.kind = kind; call.remotes = {};
  const ov = document.createElement('div'); ov.className = 'callov'; ov.id = 'callov';
  ov.innerHTML = `<div class="ctop"><b>${esc(title || 'Call')}</b><span id="ctime">সংযোগ হচ্ছে…</span></div>
    <div class="cgrid" id="cgrid"></div>
    <div class="clocal" id="clocal" ${kind === 'video' ? '' : 'hidden'}></div>
    <div class="cbtns"><button id="cmic" title="Mute">🎤</button>${kind === 'video' ? '<button id="ccam" title="Camera">📷</button><button id="cflip" title="Switch camera">🔄</button>' : ''}<button id="cend" class="red" title="End">📞</button></div>`;
  document.body.appendChild(ov);
  document.getElementById('cend').onclick = leaveCall;
  drawCallGrid();
  try {
    await loadAgora();
    AgoraRTC.setLogLevel(3);
    const client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
    call.client = client;
    client.on('user-published', async (user, type) => {
      await client.subscribe(user, type);
      call.remotes[user.uid] = call.remotes[user.uid] || { user };
      if (type === 'audio') user.audioTrack.play();
      drawCallGrid();
      if (type === 'video') { const el = document.getElementById('rv-' + user.uid); if (el) user.videoTrack.play(el); }
    });
    client.on('user-joined', user => { call.remotes[user.uid] = call.remotes[user.uid] || { user }; drawCallGrid(); });
    client.on('user-unpublished', (user, type) => { if (type === 'video') drawCallGrid(); });
    client.on('user-left', user => { delete call.remotes[user.uid]; drawCallGrid(); if (!Object.keys(call.remotes).length && call.start) toast('অন্যজন কল ছেড়ে গেছেন'); });
    const tk = await getCallToken(channel);
    client.on('token-privilege-will-expire', async () => { try { const r = await getCallToken(channel); await client.renewToken(r.token); } catch (e) {} });
    await client.join(tk.appId, channel, tk.token, tk.uid);
    call.mic = await AgoraRTC.createMicrophoneAudioTrack({ AEC: true, ANS: true });
    const tracks = [call.mic];
    if (kind === 'video') { call.cam = await AgoraRTC.createCameraVideoTrack({ encoderConfig: '480p_1' }); tracks.push(call.cam); call.cam.play('clocal'); }
    await client.publish(tracks);
    call.start = Date.now();
    call.timer = setInterval(() => { const t = Math.floor((Date.now() - call.start) / 1000); const el = document.getElementById('ctime'); if (el) el.textContent = `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; }, 1000);
    document.getElementById('cmic').onclick = async () => { const on = !call.mic.muted; await call.mic.setMuted(on); document.getElementById('cmic').classList.toggle('off', on); document.getElementById('cmic').textContent = on ? '🔇' : '🎤'; };
    const cc = document.getElementById('ccam');
    if (cc) cc.onclick = async () => { const off = !call.cam.muted; await call.cam.setMuted(off); cc.classList.toggle('off', off); document.getElementById('clocal').style.visibility = off ? 'hidden' : 'visible'; };
    const cf = document.getElementById('cflip');
    if (cf) cf.onclick = async () => {
      try { const cams = await AgoraRTC.getCameras(); if (cams.length < 2) return toast('অন্য ক্যামেরা নেই');
        const cur = call.cam.getTrackLabel(); const next = cams.find(c => c.label !== cur) || cams[0]; await call.cam.setDevice(next.deviceId);
      } catch (e) { toast('ক্যামেরা বদলানো যায়নি'); }
    };
  } catch (e) {
    const m = (e && (e.message || e.code || '')) + '';
    leaveCall(true);
    if (/PERMISSION|NotAllowed|denied/i.test(m)) toast('মাইক/ক্যামেরার অনুমতি দিন: ব্রাউজারের ঠিকানাবারের 🔒 → Permissions');
    else if (/Failed to fetch|network|NETWORK/i.test(m)) toast('ইন্টারনেট সংযোগ চেক করুন');
    else if (/TOKEN:Call expired/.test(m)) toast('এই কলটা অনেক আগের, নতুন কল দিন।');
    else if (/TOKEN:Not allowed/.test(m)) toast('এই কলে যোগ দেওয়ার অনুমতি নেই।');
    else if (/TOKEN:Call service not configured/.test(m)) toast('কল সার্ভিসের Secret সেট করা হয়নি। অ্যাডমিনকে জানান।');
    else if (/TOKEN:/.test(m)) toast('কলের টোকেন পাওয়া যায়নি (Edge Function)। অ্যাডমিনকে জানান। ' + m.slice(6, 60));
    else if (/INVALID_VENDOR_KEY|CAN_NOT_GET_GATEWAY_SERVER|dynamic key|token/i.test(m)) toast('কল সার্ভিসের সেটআপে সমস্যা (App ID/Certificate)। অ্যাডমিনকে জানান।');
    else toast('কল শুরু করা যায়নি: ' + m.slice(0, 80));
  }
}

async function leaveCall(silent) {

function ringTone(on) {
  try {
    if (!on) { clearInterval(ringInt); ringInt = null; if (ringCtx) { ringCtx.close(); ringCtx = null; } return; }
    ringCtx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => { if (!ringCtx) return; const o = ringCtx.createOscillator(), g = ringCtx.createGain(); o.frequency.value = 660; g.gain.value = 0.12; o.connect(g); g.connect(ringCtx.destination); o.start(); o.stop(ringCtx.currentTime + 0.5); };
    beep(); ringInt = setInterval(beep, 1500);
  } catch (e) {}
}

  sheet(`<h3>${n ? 'Edit notice' : 'New notice'}</h3>
    <label>Title</label><input class="in" id="nt" maxlength="150" value="${esc(n ? n.title : '')}">
    <label>Details</label><textarea class="in" id="nb" maxlength="5000">${esc(n ? n.body : '')}</textarea>
    <label>Publish time</label><input class="in" type="datetime-local" id="np" value="${local(n ? n.publish_at : new Date())}">
    <label class="check"><input type="checkbox" id="pn" ${n && n.pinned ? 'checked' : ''}> 📌 Pin on top</label>
    <label class="check"><input type="checkbox" id="im" ${n && n.important ? 'checked' : ''}> ❗ Important</label>
    <button class="btn" id="ns">${n ? 'Save' : 'Publish'}</button>`, (el, close) => {
    el.querySelector('#ns').onclick = async () => {
      const title = el.querySelector('#nt').value.trim(), body = el.querySelector('#nb').value.trim();
      if (!title || !body) return toast('শিরোনাম ও বিস্তারিত দিন');
      const row = { title, body, pinned: el.querySelector('#pn').checked, important: el.querySelector('#im').checked, publish_at: new Date(el.querySelector('#np').value || Date.now()).toISOString(), updated_at: new Date().toISOString() };
      const { error } = n ? await sb.from('notices').update(row).eq('id', n.id) : await sb.from('notices').insert({ ...row, created_by: state.profile.id });
      if (error) return toast(friendlyError(error));
      close(); toast('সেভ হয়েছে ✓'); viewNotices();
    };
  });
}

/* ---------- TASKS ---------- */
let taskFilter = 'mine';
async function viewTasks() {
  const f = [['mine', 'My tasks'], ['pending', 'Pending'], ['overdue', 'Overdue'], ['completed', 'Completed']];
  if (isMgr()) f.push(['all', 'All tasks']);
  frame(`<div class="top"><h1>Tasks</h1>${isMgr() ? '<div class="act"><button id="rpt" title="রিপিট টাস্ক">🔁</button></div>' : ''}</div>
    <div class="chips">${f.map(([k, l]) => `<button class="chip ${taskFilter === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>
    <div class="pad" id="tl" style="padding-top:8px"><div class="cen"><div class="spin dark"></div></div></div>${isMgr() ? '<button class="fab" id="nt">+</button>' : ''}`);
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { taskFilter = b.dataset.f; viewTasks(); });
  if (isMgr()) document.getElementById('nt').onclick = () => taskForm();
  if (isMgr()) document.getElementById('rpt').onclick = viewRepeats;
  let q = sb.from('tasks').select('*').order('due_date', { ascending: true, nullsFirst: false }).limit(100);
  const me = state.profile.id;
  if (taskFilter === 'mine') q = q.eq('assigned_to', me).neq('status', 'completed');
  if (taskFilter === 'pending') q = q.neq('status', 'completed');
  if (taskFilter === 'overdue') q = q.neq('status', 'completed').lt('due_date', new Date().toISOString());
  if (taskFilter === 'completed') q = q.eq('status', 'completed');
  const { data, error } = await q;
  const el = document.getElementById('tl');
  if (error) return el.innerHTML = `<div class="msg err">${esc(friendlyError(error))}</div>`;
  const list = data || [];
  let summary = '';
  if (isMgr() && taskFilter === 'all') {
    const by = s => list.filter(t => t.status === s).length;
    summary = `<div class="card"><b>Overall progress</b><div class="meta"><span>To do: ${by('todo')}</span><span>In progress: ${by('in_progress')}</span><span>Review: ${by('under_review')}</span><span>Done: ${by('completed')}</span></div>
      <div class="meter"><i style="width:${list.length ? Math.round(by('completed') / list.length * 100) : 0}%"></i></div></div>`;
  }
  el.innerHTML = summary + (list.length ? list.map(taskCard).join('') : '<div class="empty">কোনো টাস্ক নেই</div>');
  el.querySelectorAll('[data-task]').forEach(b => b.onclick = () => viewTask(b.dataset.task));
}
function taskCard(t) {
  const od = t.due_date && t.status !== 'completed' && new Date(t.due_date) < new Date();
  return `<button class="card" style="width:100%;text-align:left" data-task="${t.id}"><span class="pri ${t.priority}">● ${t.priority.toUpperCase()}</span><h4>${esc(t.title)}</h4>
    <div class="meta"><span>👤 ${esc(personName(t.assigned_to))}</span><span class="${od ? 'overdue' : ''}">${t.due_date ? (od ? 'Overdue · ' : 'Due ') + fmtDate(t.due_date) : 'No due date'}</span><span class="stt ${t.status}">${t.status.replace('_', ' ')}</span></div></button>`;
}
async function viewTask(id) {
  cleanupChannels();
  const [{ data: t, error }, { data: ups }] = await Promise.all([
    sb.from('tasks').select('*').eq('id', id).single(),
    sb.from('task_updates').select('*').eq('task_id', id).order('created_at')
  ]);
  if (error || !t) return toast('টাস্ক পাওয়া যায়নি');
  const canStatus = t.assigned_to === state.profile.id || isMgr();
  const st = [['todo', 'To Do'], ['in_progress', 'In Progress'], ['under_review', 'Under Review'], ['completed', 'Completed']];
  $app.innerHTML = `<div class="top"><button class="back" id="bk">←</button><h1>Task</h1>${isMgr() ? '<div class="act"><button id="ed">✏️</button>' + (isAdmin() ? '<button id="dl">🗑️</button>' : '') + '</div>' : ''}</div>
  <div class="pad" style="padding-top:10px">
    <span class="pri ${t.priority}">● ${t.priority.toUpperCase()}</span><h2 style="margin-top:6px;font-size:21px">${esc(t.title)}</h2>
    ${t.description ? `<div class="body" style="margin-top:10px;white-space:pre-wrap;font-size:14.5px;line-height:1.6">${linkify(t.description)}</div>` : ''}
    <div style="margin-top:14px">
      <div class="kv"><span>Assigned to</span><b>${esc(personName(t.assigned_to))}</b></div>
      <div class="kv"><span>Created by</span><b>${esc(personName(t.created_by))}</b></div>
      <div class="kv"><span>Due</span><b>${t.due_date ? fmtDate(t.due_date) + ' ' + fmtTime(t.due_date) : '—'}</b></div>
      ${t.completed_at ? `<div class="kv"><span>Completed</span><b>${fmtDate(t.completed_at)}</b></div>` : ''}
    </div>
    <label>Status</label><select class="in" id="ss" ${canStatus ? '' : 'disabled'}>${st.map(([k, l]) => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <div class="sec">Progress updates</div>
    ${(ups || []).map(u => `<div class="upd">${u.new_status ? `<b>→ ${esc(u.new_status.replace('_', ' '))}</b> ` : ''}${u.comment ? linkify(u.comment) : ''}<small>${esc(personName(u.user_id))} · ${fmtDate(u.created_at)} ${fmtTime(u.created_at)}</small></div>`).join('') || '<p class="mut">এখনো কোনো আপডেট নেই</p>'}
    <label>Add a comment</label><textarea class="in" id="cm" maxlength="2000" placeholder="কাজের অগ্রগতি লিখুন…" style="min-height:70px"></textarea>
    <button class="btn" id="sv">Save update</button>
  </div>`;
  document.getElementById('bk').onclick = () => go('tasks');
  const ed = document.getElementById('ed'); if (ed) ed.onclick = () => taskForm(t);
  const dl = document.getElementById('dl'); if (dl) dl.onclick = async () => {
    if (!confirm('টাস্কটা মুছে ফেলবেন?')) return;
    const { error } = await sb.from('tasks').delete().eq('id', t.id); if (error) return toast(friendlyError(error)); go('tasks');
  };
  document.getElementById('sv').onclick = async () => {
    const ns = document.getElementById('ss').value, cm = document.getElementById('cm').value.trim();
    if (ns === t.status && !cm) return toast('কিছু পরিবর্তন করা হয়নি');
    if (ns !== t.status) { const { error } = await sb.from('tasks').update({ status: ns }).eq('id', t.id); if (error) return toast(friendlyError(error)); }
    const { error: e2 } = await sb.from('task_updates').insert({ task_id: t.id, user_id: state.profile.id, comment: cm || null, new_status: ns !== t.status ? ns : null });
    if (e2) return toast(friendlyError(e2));
    toast('আপডেট সেভ হয়েছে ✓'); viewTask(t.id);
  };
}
function taskForm(t) {
  const local = d => { if (!d) return ''; const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 16); };
  const people = Object.values(ui.people).sort((a, b) => a.full_name.localeCompare(b.full_name));
  sheet(`<h3>${t ? 'Edit task' : 'New task'}</h3>
    <label>Title</label><input class="in" id="tt" maxlength="150" value="${esc(t ? t.title : '')}">
    <label>Description</label><textarea class="in" id="td" maxlength="5000">${esc(t ? t.description || '' : '')}</textarea>
    <label>Assign to</label><select class="in" id="ta"><option value="">বেছে নিন</option>${people.map(p => `<option value="${p.id}" ${t && t.assigned_to === p.id ? 'selected' : ''}>${esc(p.full_name)}</option>`).join('')}</select>
    <label>Priority</label><select class="in" id="tp">${['low', 'medium', 'high', 'urgent'].map(p => `<option value="${p}" ${(t ? t.priority : 'medium') === p ? 'selected' : ''}>${p[0].toUpperCase() + p.slice(1)}</option>`).join('')}</select>
    ${t ? '' : `<label>রিপিট</label><select class="in" id="trp"><option value="">একবারের কাজ</option><option value="daily">🔁 প্রতিদিন</option><option value="weekly">🔁 সপ্তাহের নির্দিষ্ট দিন</option><option value="monthly">🔁 প্রতি মাসে</option></select>
    <div class="wdays" id="trwd" hidden>${['রবি', 'সোম', 'মঙ্গল', 'বুধ', 'বৃহঃ', 'শুক্র', 'শনি'].map((d, i) => `<label class="wd"><input type="checkbox" value="${i}">${d}</label>`).join('')}</div>
    <div id="trmd" hidden><label>মাসের কত তারিখে (১–২৮)</label><input class="in" id="trday" type="number" min="1" max="28" value="${Math.min(28, new Date().getDate())}"></div>
    <p class="mut" id="trnote" hidden style="margin:6px 0 0">প্রতিবার সকাল ৯টায় নিজে থেকে টাস্ক তৈরি হবে, শেষ করতে হবে রাত ৯টার মধ্যে। আজকেরটা এখনই তৈরি হবে।</p>`}
    <label>Due date</label><input class="in" type="datetime-local" id="tdd" value="${local(t && t.due_date)}">
    <button class="btn" id="ts">${t ? 'Save' : 'Create task'}</button>`, (el, close) => {
    const trp = el.querySelector('#trp');
    if (trp) trp.onchange = () => { const v = trp.value; el.querySelector('#trwd').hidden = v !== 'weekly'; el.querySelector('#trmd').hidden = v !== 'monthly'; el.querySelector('#trnote').hidden = !v; el.querySelector('#tdd').disabled = !!v; };
    el.querySelector('#ts').onclick = async () => {
      const title = el.querySelector('#tt').value.trim(), assigned_to = el.querySelector('#ta').value;
      if (!title) return toast('টাস্কের নাম দিন'); if (!assigned_to) return toast('কাকে দেবেন বেছে নিন');
      const rp = trp ? trp.value : '';
      if (rp) {
        const wd = [...el.querySelectorAll('#trwd input:checked')].map(x => +x.value);
        if (rp === 'weekly' && !wd.length) return toast('কোন কোন দিন, বেছে নিন');
        const tpl = { title, description: el.querySelector('#td').value.trim() || null, assigned_to, priority: el.querySelector('#tp').value, freq: rp, weekdays: rp === 'weekly' ? wd : null, month_day: rp === 'monthly' ? Math.min(28, Math.max(1, +el.querySelector('#trday').value || 1)) : null, created_by: state.profile.id };
        const { data: nt, error: e1 } = await sb.from('yg_task_templates').insert(tpl).select('id').single();
        if (e1) return toast(friendlyError(e1));
        const { data: made } = await sb.rpc('yg_template_run_now', { p_id: nt.id });
        close(); toast(made ? '🔁 রিপিট টাস্ক সেট হয়েছে · আজকেরটা তৈরি ✓' : '🔁 রিপিট টাস্ক সেট হয়েছে ✓'); return viewTasks();
      }
      const dd = el.querySelector('#tdd').value;
      const row = { title, description: el.querySelector('#td').value.trim() || null, assigned_to, priority: el.querySelector('#tp').value, due_date: dd ? new Date(dd).toISOString() : null, department_id: (ui.people[assigned_to] || {}).department_id || null };
      const { error } = t ? await sb.from('tasks').update(row).eq('id', t.id) : await sb.from('tasks').insert({ ...row, created_by: state.profile.id });
      if (error) return toast(friendlyError(error));
      close(); toast('সেভ হয়েছে ✓'); t ? viewTask(t.id) : viewTasks();
    };
  });
}

    <label>আজকে কী কী কাজ করেছেন *</label><textarea class="in" id="wd" maxlength="5000" placeholder="• ৩টা ভিসা ফাইল জমা&#10;• ২ জন ক্লায়েন্ট ফলো-আপ">${esc(r ? r.work_done : '')}</textarea>

    <label>Drive link (ঐচ্ছিক)</label><input class="in" id="al" maxlength="500" placeholder="https://drive.google.com/…" value="${esc(r ? r.attachment_link || '' : '')}">
    <button class="btn" id="sb">${r ? 'Update report' : 'Submit report'}</button>
    <div class="sec">My recent reports</div><div id="mine"></div>
  </div>`;
  document.getElementById('bk').onclick = () => go('menu');
  const all = document.getElementById('all'); if (all) all.onclick = () => teamReports(today);
  document.getElementById('sb').onclick = async () => {
    const work_done = document.getElementById('wd').value.trim(); if (!work_done) return toast('কাজের বিবরণ লিখুন');
    const lc = document.getElementById('lc').value;
    const row = { user_id: state.profile.id, report_date: today, work_done, leads_count: lc === '' ? null : Math.max(0, parseInt(lc, 10) || 0), issues: document.getElementById('is').value.trim() || null, attachment_link: document.getElementById('al').value.trim() || null, updated_at: new Date().toISOString() };
    const { error } = await sb.from('daily_reports').upsert(row, { onConflict: 'user_id,report_date' });
    if (error) return toast(friendlyError(error));
    toast('রিপোর্ট জমা হয়েছে ✓'); viewReport();
  };
  const { data: mine } = await sb.from('daily_reports').select('*').eq('user_id', state.profile.id).order('report_date', { ascending: false }).limit(7);
  document.getElementById('mine').innerHTML = (mine || []).map(reportCard).join('') || '<p class="mut">এখনো কোনো রিপোর্ট নেই</p>';
}
function reportCard(r, showName) {
  return `<div class="card"><div class="meta" style="margin-top:0"><b style="color:var(--navy)">${showName ? esc(personName(r.user_id)) : fmtDate(r.report_date)}</b>${r.leads_count != null ? `<span>Leads: ${r.leads_count}</span>` : ''}</div>
    <div class="body" style="margin-top:6px">${linkify(r.work_done)}</div>${r.issues ? `<div class="msg info" style="margin-top:8px">⚠️ ${linkify(r.issues)}</div>` : ''}${r.attachment_link ? `<div style="margin-top:6px;font-size:13px">${linkify(r.attachment_link)}</div>` : ''}</div>`;
}
async function teamReports(date) {
  $app.innerHTML = `<div class="top"><button class="back" id="bk">←</button><h1>Team reports</h1></div>
    <div class="pad" style="padding-top:6px"><label>Date</label><input class="in" type="date" id="dt" value="${date}"><div id="rl" style="margin-top:6px"></div></div>`;
  document.getElementById('bk').onclick = viewReport;
  const load = async d => {
    const { data } = await sb.from('daily_reports').select('*').eq('report_date', d);
    const got = new Set((data || []).map(r => r.user_id));
    const missing = Object.values(ui.people).filter(p => !got.has(p.id));
    document.getElementById('rl').innerHTML = `<p class="mut" style="margin:8px 0">জমা: ${got.size} / ${Object.keys(ui.people).length}</p>` + (data || []).map(r => reportCard(r, true)).join('') +
      (missing.length ? `<div class="sec">এখনো জমা দেননি</div><p class="mut">${missing.map(p => esc(p.full_name)).join(', ')}</p>` : '');
  };
  document.getElementById('dt').onchange = e => load(e.target.value);
  load(date);
}

async function squareImage(file, size = 400) {
  const bmp = await createImageBitmap(file);
  const side = Math.min(bmp.width, bmp.height);
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, size, size);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}
async function removeOldAvatar(url) {

// Public key comes from the 'push-notify' Edge Function (keys are created automatically on the server)
let VAPID_PUBLIC = null;
async function pushPublicKey() {
  if (VAPID_PUBLIC) return VAPID_PUBLIC;
  const r = await fetch(SUPABASE_URL + '/functions/v1/push-notify', { headers: { apikey: SUPABASE_KEY } });
  if (!r.ok) throw new Error('নোটিফিকেশন সার্ভার (push-notify) পাওয়া যায়নি [' + r.status + ']');
  const j = await r.json(); if (!j.publicKey) throw new Error('নোটিফিকেশন সার্ভারের key নেই');
  return (VAPID_PUBLIC = j.publicKey);
}
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const pushState = () => !pushSupported() ? 'unsupported' : Notification.permission; // granted | denied | default
function b64ToBytes(b64) { const p = '='.repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
async function savePush(silent) {
  try {
    const reg = await navigator.serviceWorker.ready;
    const key = b64ToBytes(await pushPublicKey());
    let sub = await reg.pushManager.getSubscription();
    if (sub) { // made with an old key? → renew
      const cur = sub.options && sub.options.applicationServerKey ? new Uint8Array(sub.options.applicationServerKey) : null;
      if (!cur || cur.length !== key.length || cur.some((v, i) => v !== key[i])) { await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    const j = sub.toJSON();
    await sb.from('yg_push_subscriptions').delete().eq('endpoint', j.endpoint);
    const { error } = await sb.from('yg_push_subscriptions').insert({ user_id: state.profile.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent.slice(0, 200) });
    if (error) throw error;
    if (!silent) toast('🔔 নোটিফিকেশন চালু হয়েছে ✓');
    return true;
  } catch (e) { if (!silent) toast('নোটিফিকেশন চালু করা যায়নি: ' + ((e && e.message) || '').slice(0, 60)); return false; }
}
async function enablePush() {
  if (!pushSupported()) return toast('এই ফোন/ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই। Chrome দিয়ে অ্যাপ Install করে নিন।');
  if (Notification.permission === 'denied') return pushHelp();
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return pushHelp();
  await savePush(false);
  const b = document.getElementById('pushban'); if (b) b.remove();
}

function handleDeepLink(href) {
  let u; try { u = new URL(href || location.href); } catch (e) { return; }

  if (location.search) history.replaceState(null, '', location.pathname);
  if (callId) return (async () => {
    const { data: m } = await sb.from('messages').select('*').eq('id', callId).maybeSingle();
    if (m && Date.now() - new Date(m.created_at).getTime() < 3 * 60000) { await refreshUnread(); const cv = ui.convs.find(x => x.id === m.conversation_id); joinCall(m.id, k === 'video' ? 'video' : 'audio', cv ? convTitle(cv) : 'Call'); }

  if (n) return go('notices');
}

async function perfCard(userId, boxId, title) {
  const box = document.getElementById(boxId); if (!box) return;
  box.innerHTML = `<div class="card perf"><div class="hsec" style="margin:0 0 6px"><span class="hsi">📈</span><b>${esc(title || 'আমার পারফরম্যান্স')}</b></div><div class="cen" style="padding:16px"><div class="spin dark"></div></div></div>`;
  const [{ data: wk, error }, { data: aw }] = await Promise.all([
    sb.rpc('user_weekly_stats', { p_user: userId, p_weeks: 8 }),
    sb.rpc('weekly_awards', { p_weeks: 12 })
  ]);
  const card = box.querySelector('.perf');
  if (error) { card.innerHTML += `<p class="mut">পারফরম্যান্স দেখা যাচ্ছে না। অ্যাডমিন <b>yaqeen_step7_performance.sql</b> চালিয়েছেন কিনা দেখুন।</p>`; card.querySelector('.cen').remove(); return; }
  const rows = wk || [];
  const max = Math.max(1, ...rows.map(r => Number(r.completed)));
  const tot = rows.reduce((a, r) => a + Number(r.completed), 0), ot = rows.reduce((a, r) => a + Number(r.on_time), 0);
  const withAvg = rows.filter(r => r.avg_hours != null);
  const avgH = withAvg.length ? withAvg.reduce((a, r) => a + Number(r.avg_hours) * Number(r.completed), 0) / Math.max(1, withAvg.reduce((a, r) => a + Number(r.completed), 0)) : null;
  const mine = (aw || []).filter(a => a.user_id === userId && !a.is_current);
  const gold = mine.filter(a => a.place === 1).length, silver = mine.filter(a => a.place === 2).length, bronze = mine.filter(a => a.place === 3).length;
  const W = 300, Hh = 130, bw = W / rows.length;
  const bars = rows.map((r, i) => {
    const c = Number(r.completed), o = Number(r.on_time), l = c - o;
    const hO = o / max * (Hh - 34), hL = l / max * (Hh - 34), x = i * bw + bw * 0.2, w = bw * 0.6, base = Hh - 16;
    return `<rect x="${x}" y="${base - hO}" width="${w}" height="${hO}" rx="3" fill="#0F7C7A"/>` +
      `<rect x="${x}" y="${base - hO - hL}" width="${w}" height="${hL}" rx="3" fill="#E9A23B"/>` +
      (c ? `<text x="${x + w / 2}" y="${base - hO - hL - 4}" text-anchor="middle" font-size="10" fill="#14222E" font-weight="700">${c}</text>` : '') +
      `<text x="${x + w / 2}" y="${Hh - 2}" text-anchor="middle" font-size="8.5" fill="#6b7a86">${weekLabel(r.week_start)}</text>`;
  }).join('');
  card.innerHTML = `<div class="hsec" style="margin:0 0 6px"><span class="hsi">📈</span><b>${esc(title || 'আমার পারফরম্যান্স')}</b><span class="mut" style="font-size:11.5px">শেষ ৮ সপ্তাহ</span></div>
    <div class="pstats"><div><b>${tot}</b><span>টাস্ক শেষ</span></div><div><b>${tot ? Math.round(ot / tot * 100) : 0}%</b><span>সময়মতো</span></div><div><b>${hrs(avgH)}</b><span>গড় সময়</span></div><div><b>${gold ? '🏆' + gold : '–'}</b><span>ট্রফি</span></div></div>
    <svg viewBox="0 0 ${W} ${Hh}" class="pchart" role="img" aria-label="weekly completed tasks"><line x1="0" y1="${Hh - 16}" x2="${W}" y2="${Hh - 16}" stroke="#E3E9ED"/>${bars}</svg>
    <div class="legend"><span><i style="background:#0F7C7A"></i>সময়মতো শেষ</span><span><i style="background:#E9A23B"></i>দেরিতে শেষ</span></div>
    ${gold + silver + bronze ? `<p class="mut" style="font-size:12.5px;margin-top:6px">অর্জন (১২ সপ্তাহ): ${gold ? '🏆 ' + gold + ' ' : ''}${silver ? '🥈 ' + silver + ' ' : ''}${bronze ? '🥉 ' + bronze : ''}</p>` : ''}`;
}

async function taskReportData(date) {
  const [from, to] = dhakaDayRange(date);
  const [{ data: done, error: e1 }, { data: pend, error: e2 }, { data: reps }] = await Promise.all([
    sb.from('tasks').select('*').gte('completed_at', from.toISOString()).lt('completed_at', to.toISOString()),
    sb.from('tasks').select('*').neq('status', 'completed').lt('created_at', to.toISOString()),
    sb.from('daily_reports').select('user_id').eq('report_date', date)
  ]);
  if (e1 || e2) return { error: friendlyError(e1 || e2) };
  await loadPeople();
  const repSet = new Set((reps || []).map(r => r.user_id));
  const people = Object.values(ui.people).sort((a, b) => a.full_name.localeCompare(b.full_name)).map(p => {
    const d = (done || []).filter(t => t.assigned_to === p.id), q = (pend || []).filter(t => t.assigned_to === p.id);
    const od = q.filter(t => t.due_date && new Date(t.due_date) < Math.min(to, new Date()));
    return { p, done: d, pending: q, overdue: od, report: repSet.has(p.id) };
  });
  return { date, people, totals: { done: (done || []).length, pending: (pend || []).length, overdue: people.reduce((a, x) => a + x.overdue.length, 0), reports: repSet.size, members: people.length } };
}

    <table class="trt"><thead><tr><th>সদস্য</th><th>✅ শেষ</th><th>⏳ বাকি</th><th>⏰ ওভারডিউ</th><th>📝 রিপোর্ট</th></tr></thead><tbody>
      ${r.people.map(x => `<tr><td>${esc(x.p.full_name)}</td><td class="n">${x.done.length}</td><td class="n">${x.pending.length}</td><td class="n ${x.overdue.length ? 'bad' : ''}">${x.overdue.length}</td><td class="n">${x.report ? '✓' : '✗'}</td></tr>`).join('')}
    </tbody></table>
    ${r.people.filter(x => x.done.length || x.pending.length).map(x => `<div class="trp"><b>${esc(x.p.full_name)}</b>${x.p.designation ? ` <span>· ${esc(x.p.designation)}</span>` : ''}<ul>${x.done.map(t => tline(t, true)).join('')}${x.pending.map(t => tline(t, false)).join('')}</ul></div>`).join('') || '<div class="hempty"><span>📭</span>এই দিনে কোনো টাস্ক নেই</div>'}
    ${forPdf ? `<div class="trf">Generated by Yaqeen Group Team App · ${new Date().toLocaleString('en-GB')}</div>` : ''}
  </div>`;
}
async function exportTaskReport(r, share) {
  toast('PDF তৈরি হচ্ছে…');
  try {
    await Promise.all([loadScript(H2C_URL, () => window.html2canvas), loadScript(JSPDF_URL, () => window.jspdf)]);
    const host = document.createElement('div'); host.className = 'pdfhost'; host.innerHTML = taskReportHTML(r, true);
    document.body.appendChild(host);
    await Promise.all([...host.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(res => { i.onload = i.onerror = res; })));
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(host.firstElementChild, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    host.remove();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    const pxPerPt = canvas.width / pw, pageHpx = Math.floor(ph * pxPerPt);
    for (let y = 0, i = 0; y < canvas.height; y += pageHpx, i++) {
      const h = Math.min(pageHpx, canvas.height - y);
      const c = document.createElement('canvas'); c.width = canvas.width; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, h); g.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pw, h / pxPerPt);
    }
    const name = `Yaqeen-Task-Report-${r.date}.pdf`;
    const blob = pdf.output('blob'), file = new File([blob], name, { type: 'application/pdf' });
    if (share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Daily Task Report', text: `Yaqeen Group · Daily Task Report · ${r.date}` }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast(share ? 'শেয়ার করা যায়নি, PDF ডাউনলোড হয়েছে। WhatsApp থেকে ফাইলটা পাঠান।' : 'PDF ডাউনলোড হয়েছে ✓');
  } catch (e) {
    const h = document.querySelector('.pdfhost'); if (h) h.remove();
    toast(/fetch/i.test(String(e && e.message)) ? 'ইন্টারনেট সংযোগ চেক করুন' : 'PDF তৈরি করা যায়নি');
  }
}

async function exportHtmlPdf(html, name, text, share) {
  toast('PDF তৈরি হচ্ছে…');
  try {
    await Promise.all([loadScript(H2C_URL, () => window.html2canvas), loadScript(JSPDF_URL, () => window.jspdf)]);
    const host = document.createElement('div'); host.className = 'pdfhost'; host.innerHTML = html; document.body.appendChild(host);
    await Promise.all([...host.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(res => { i.onload = i.onerror = res; })));
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(host.firstElementChild, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    host.remove();
    const { jsPDF } = window.jspdf; const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), k = canvas.width / pw, pageH = Math.floor(ph * k);
    for (let y = 0, i = 0; y < canvas.height; y += pageH, i++) {
      const h = Math.min(pageH, canvas.height - y), c = document.createElement('canvas'); c.width = canvas.width; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, h); g.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (i) pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pw, h / k);
    }
    const blob = pdf.output('blob'), file = new File([blob], name, { type: 'application/pdf' });
    if (share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name, text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast(share ? 'শেয়ার করা যায়নি, PDF ডাউনলোড হয়েছে।' : 'PDF ডাউনলোড হয়েছে ✓');
  } catch (e) { const h = document.querySelector('.pdfhost'); if (h) h.remove(); toast(/fetch/i.test(String(e && e.message)) ? 'ইন্টারনেট সংযোগ চেক করুন' : 'PDF তৈরি করা যায়নি'); }
}

function gpsErr(m) {
  if (/GPS_DENIED/.test(m)) return 'লোকেশনের অনুমতি দিন: ফোনের Settings → Apps → Yaqeen Group (বা Chrome) → Permissions → Location → Allow';
  if (/GPS_TIMEOUT|GPS_FAIL/.test(m)) return 'লোকেশন পাওয়া যায়নি। ফোনের Location (GPS) চালু করে জানালার কাছে গিয়ে আবার চেষ্টা করুন।';
  if (/GPS_WEAK/.test(m)) return 'GPS সিগন্যাল দুর্বল। Location চালু রেখে কয়েক সেকেন্ড পর আবার চেষ্টা করুন।';
  if (/NOT_IN_OFFICE:(\d+):(.*)/.test(m)) { const [, d, n] = m.match(/NOT_IN_OFFICE:(\d+):([^"]*)/); return `আপনি অফিসের লোকেশনে নেই (${n} থেকে প্রায় ${Number(d) >= 1000 ? (d / 1000).toFixed(1) + ' কিমি' : d + ' মিটার'} দূরে)। অফিসে পৌঁছে হাজিরা দিন।`; }
  if (/NO_OFFICE/.test(m)) return 'অফিসের লোকেশন এখনো সেট করা হয়নি। অ্যাডমিনকে জানান।';
  if (/ALREADY_IN/.test(m)) return 'আজকের ঢোকার হাজিরা আগেই দেওয়া হয়েছে।';
  if (/ALREADY_OUT/.test(m)) return 'আজকের বের হওয়ার হাজিরা আগেই দেওয়া হয়েছে।';
  if (/NOT_IN_YET/.test(m)) return 'আগে অফিসে ঢোকার হাজিরা দিন।';
  if (/NOT_ACTIVE/.test(m)) return 'অ্যাকাউন্ট সক্রিয় নয়।';
  return null;
}

/* ---- live selfie camera ---- */
function takeSelfie(label) {
  return new Promise(async (resolve, reject) => {
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } }, audio: false }); }
    catch (e) { return reject(new Error(/NotAllowed|Permission/i.test(e.name + e.message) ? 'CAM_DENIED' : 'CAM_FAIL')); }
    const ov = document.createElement('div'); ov.className = 'camov';
    ov.innerHTML = `<div class="camtop"><b>📸 ${esc(label)}</b><span>মুখ ফ্রেমের মাঝে রাখুন</span></div><div class="camwrap"><video autoplay playsinline muted></video><div class="camframe"></div></div>
      <div class="cambtns"><button class="camx" id="camx">✕</button><button class="camshot" id="camshot"></button><span style="width:52px"></span></div>`;
    document.body.appendChild(ov);
    const v = ov.querySelector('video'); v.srcObject = stream;
    const stop = () => { stream.getTracks().forEach(t => t.stop()); ov.remove(); };
    ov.querySelector('#camx').onclick = () => { stop(); reject(new Error('CANCEL')); };
    ov.querySelector('#camshot').onclick = () => {
      const w = 480, h = Math.round(w * (v.videoHeight || 640) / (v.videoWidth || 480));
      const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
      g.translate(w, 0); g.scale(-1, 1); g.drawImage(v, 0, 0, w, h); g.setTransform(1, 0, 0, 1, 0, 0);
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, h - 46, w, 46); g.fillStyle = '#fff'; g.font = '600 15px Inter, "Noto Sans Bengali", sans-serif';
      g.fillText(state.profile.full_name, 12, h - 26); g.font = '13px Inter, sans-serif'; g.fillText(new Date().toLocaleString('en-GB') + ' · Yaqeen Group', 12, h - 9);
      c.toBlob(b => { stop(); b ? resolve(b) : reject(new Error('CAM_FAIL')); }, 'image/jpeg', 0.72);
    };
  });
}

async function markAttendance(kind) {
  const step = document.getElementById('astep'), btn = document.getElementById('amark');
  const say = t => { if (step) step.innerHTML = t; };
  btn.disabled = true;
  try {
    say('📍 লোকেশন যাচাই হচ্ছে…');
    const pos = await getGPS();
    await loadOffices(true);
    if (!officesCache.length) throw new Error('NO_OFFICE');
    const near = officesCache.map(o => ({ o, d: distM(pos.latitude, pos.longitude, o.lat, o.lng) })).sort((a, b) => a.d - b.d)[0];
    if (near.d > near.o.radius_m + Math.min(pos.accuracy || 0, 60)) throw new Error(`NOT_IN_OFFICE:${Math.round(near.d)}:${near.o.name}`);
    say(`✅ ${esc(near.o.name)}-এ আছেন। এবার সেলফি তুলুন…`);
    const blob = await takeSelfie(kind === 'in' ? 'অফিসে ঢোকার হাজিরা' : 'বের হওয়ার হাজিরা');
    say('⏫ সেলফি আপলোড হচ্ছে…');
    const path = `${state.profile.id}/${todayDhaka()}-${kind}-${Date.now()}.jpg`;
    const { error: ue } = await sb.storage.from('attendance').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if (ue) throw ue;
    say('📝 হাজিরা সেভ হচ্ছে…');
    const { data, error } = await sb.rpc('attendance_mark', { p_kind: kind, p_lat: pos.latitude, p_lng: pos.longitude, p_acc: pos.accuracy || null, p_selfie: path });
    if (error) throw error;
    toast(kind === 'in' ? (data.late_minutes ? `হাজিরা হয়েছে · ${lateText(data.late_minutes)}` : 'হাজিরা হয়েছে · সময়মতো ✅') : 'বের হওয়ার হাজিরা হয়েছে ✅');
    viewAttendance();
  } catch (e) {
    const m = (e && (e.message || '')) + '';
    btn.disabled = false; say('');
    if (/CANCEL/.test(m)) return;
    if (/CAM_DENIED/.test(m)) return toast('ক্যামেরার অনুমতি দিন: Settings → Apps → Yaqeen Group (বা Chrome) → Permissions → Camera → Allow');
    if (/CAM_FAIL/.test(m)) return toast('ক্যামেরা চালু করা যায়নি। অ্যাপ বন্ধ করে আবার চেষ্টা করুন।');
    toast(gpsErr(m) || friendlyError(e));
  }
}

    const anchor = document.querySelector('.hrow2') || document.getElementById('scard') || document.querySelector('.qgrid');
    if (anchor && !document.getElementById('today')) {
      anchor.insertAdjacentHTML('beforebegin', `<div class="card today" id="today"><div class="tdh"><b>📋 আজকের কাজ</b><span class="mut" id="tdsum">…</span></div><div id="tdl"></div><div class="tdf"><button class="tdb" id="tdchat">💬 না পড়া মেসেজ <b id="tdun">${ui.unread || 0}</b></button><button class="tdb" id="tdcrm">📊 CRM ফলো-আপ</button></div></div>`);
      document.getElementById('tdchat').onclick = () => go('chats');
      document.getElementById('tdcrm').onclick = () => go('crm');
      const end = new Date(todayDhaka() + 'T23:59:59+06:00').toISOString();
      const { data } = await sb.from('tasks').select('id,title,due_date,status').eq('assigned_to', state.profile.id).neq('status', 'completed').lte('due_date', end).order('due_date', { ascending: true }).limit(6);
      const box = document.getElementById('tdl'), sum = document.getElementById('tdsum'); if (!box) return pr;
      const list = data || [], now = Date.now(), late = list.filter(t => new Date(t.due_date).getTime() < now).length;
      sum.textContent = list.length ? list.length + 'টা বাকি' + (late ? ' · ' + late + 'টা দেরি' : '') : '';
      box.innerHTML = list.length ? list.map(t => { const d = new Date(t.due_date), isLate = d.getTime() < now; const when = isLate ? (d.toDateString() === new Date().toDateString() ? 'দেরি' : 'আগের দিনের') : d.toLocaleTimeString('bn-BD', { hour: 'numeric', minute: '2-digit' }) + ' পর্যন্ত'; return `<button class="tdr" data-t="${t.id}"><span>${isLate ? '⚠️' : '⬜'} ${esc(t.title)}</span><small class="${isLate ? 'late' : ''}">${when}</small></button>`; }).join('') : '<div class="tdok">✅ আজকের সব কাজ শেষ, মাশাআল্লাহ!</div>';
      box.querySelectorAll('.tdr').forEach(b => b.onclick = () => viewTask(b.dataset.t));
      setTimeout(() => { const u = document.getElementById('tdun'); if (u) u.textContent = ui.unread || 0; }, 1500);
    }
  } catch (e) { /* the card is a helper; never break the home screen */ }
  return pr;
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', ev => { if (ev.data && ev.data.type === 'yg-notif') refreshNotifCount(); });
setInterval(() => { if (!document.hidden && state.profile) refreshNotifCount(); }, 60000);
renderSplash();
setTimeout(route, 600);
// after a long sleep in the background, start fresh so nothing stays frozen
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 30 * 60 * 1000 && !document.querySelector('input:focus, textarea:focus')) location.reload();
});
</script>
